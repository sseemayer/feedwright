name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release & Publish Image
    runs-on: ubuntu-latest
    # STRIPPED_VERSION is computed in a dedicated step below and exported to
    # the job environment via $GITHUB_ENV. Using a shell step avoids expression
    # parser limitations and keeps the logic simple.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history and tags to compute changelog

      - name: Compute stripped version
        # Compute a version value suitable for exposing in the image/runtime.
        # If the tag starts with 'v' strip it; otherwise use the tag as-is.
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "STRIPPED_VERSION=${GITHUB_REF_NAME:1}" >> $GITHUB_ENV
          else
            echo "STRIPPED_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Feedwright ${{ env.STRIPPED_VERSION }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            FEEDWRIGHT_VERSION=${{ env.STRIPPED_VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.STRIPPED_VERSION }}
            ghcr.io/${{ github.repository }}:latest
