name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release & Publish Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history and tags to compute changelog

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ensure tags are present
          git fetch --tags

          # list tags sorted by version (newest first)
          mapfile -t tags < <(git tag --sort=-v:refname)

          # find previous tag (the one right after current in the sorted list)
          prev=""
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$TAG" ]; then
              idx=$i
              break
            fi
          done
          if [ -n "${idx}" ] && [ $((idx+1)) -lt ${#tags[@]} ]; then
            prev=${tags[$((idx+1))]}
          fi

          if [ -n "$prev" ]; then
            range="$prev..$TAG"
          else
            # no previous tag found -> include all commits up to the tag
            range="$TAG"
          fi

          # generate a simple changelog: one line per commit
          changelog=$(git log --pretty=format:'- %s (%an)' $range || true)

          if [ -z "$changelog" ]; then
            changelog="- (no commits found)"
          fi

          date=$(date -u +"%Y-%m-%d")
          body="## $TAG ($date)\n\n$changelog"

          # save to file for debugging/inspection in artifacts
          echo -e "$body" > release_changelog.md

          # set step output so later steps can use it
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
